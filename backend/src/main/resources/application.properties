spring.application.name=salary

# H2 in file mode: same SQL dialect as the in-memory test database.
spring.datasource.url=jdbc:h2:file:${ACME_DATA_DIR:./data}/acme;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=

# Flyway owns the schema; Hibernate only checks that entities match it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Never let a client request more than 100 rows per page.
spring.data.web.pageable.max-page-size=100

springdoc.swagger-ui.path=/api/docs
springdoc.api-docs.path=/api/openapi
